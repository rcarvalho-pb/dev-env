theme = "catppuccin_mocha"

[editor]
true-color = true
cursorline = true
color-modes = true
line-number = "relative"
mouse = false
# bufferline = "multiple"

[editor.indent-guides]
render = true
character = '|'
skip-levels = 1

# [editor.lsp]
# display-inlay-hints = true

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]
space = {i = {h = ":toggle lsp.display-inlay-hints"}}

[keys.insert]
j = {k = "normal_mode", j = "normal_mode"}

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"
